<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клеточный автомат</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; cursor: crosshair; touch-action: none;
  }
  #panel {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    max-width: calc(100vw - 32px); padding: 8px;
    background: rgba(10, 12, 20, .6); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .12); border-radius: 14px;
    font: 13px/1 system-ui, -apple-system, sans-serif;
  }
  button {
    padding: 8px 12px; color: #dfe3f0; background: rgba(255, 255, 255, .06);
    border: 1px solid transparent; border-radius: 9px; font: inherit; cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, .14); }
  button.on { border-color: rgba(255, 255, 255, .5); background: rgba(255, 255, 255, .18); }
  #hint {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(255, 255, 255, .75); font: 13px system-ui, -apple-system, sans-serif;
    text-shadow: 0 1px 4px #000; pointer-events: none; transition: opacity 1s;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Кликай и води мышкой по полю · 1–4 режимы · пробел — пауза</div>
<div id="panel"></div>
<script>
const CELL = 4; // размер клетки в CSS-пикселях

// gen — правила семейства Generations: born/survive по числу живых соседей,
// c — число состояний (2 = обычная «Жизнь», больше — клетка «умирает» несколько шагов)
const MODES = [
  { name: 'Спирали', type: 'cyclic', n: 14 },
  { name: 'Жизнь', type: 'gen', born: [3], survive: [2, 3], c: 2, density: .25, hue: 190 },
  { name: 'Мозг Брайана', type: 'gen', born: [2], survive: [], c: 3, density: .08, hue: 280 },
  { name: 'Звёздные войны', type: 'gen', born: [2], survive: [3, 4, 5], c: 4, density: .3, hue: 20 },
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');
const hint = document.getElementById('hint');

let W, H, cur, next, heat, img, px;
let mode = MODES[0], paused = false, frame = 0;
const lut = new Uint32Array(256);
const bornT = new Uint8Array(9), surviveT = new Uint8Array(9);

function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return (255 << 24) | (f(4) << 16) | (f(8) << 8) | f(0); // ABGR для little-endian
}

function buildLut() {
  if (mode.type === 'cyclic') {
    for (let i = 0; i < mode.n; i++) lut[i] = hsl(i / mode.n * 360 + frame * .4, .85, .5);
  } else {
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      lut[i] = hsl(mode.hue + 70 * t, .9, .03 + .55 * t * t);
    }
    lut[255] = hsl(mode.hue + 70, 1, .88);
  }
}

function seed() {
  const cyc = mode.type === 'cyclic';
  for (let i = 0; i < cur.length; i++) {
    cur[i] = cyc ? Math.random() * mode.n : Math.random() < mode.density;
    heat[i] = 0;
  }
}

function clearField() {
  cur.fill(0);
  heat.fill(0);
}

function resize() {
  W = Math.ceil(innerWidth / CELL);
  H = Math.ceil(innerHeight / CELL);
  canvas.width = W;
  canvas.height = H;
  cur = new Uint8Array(W * H);
  next = new Uint8Array(W * H);
  heat = new Uint8Array(W * H);
  img = ctx.createImageData(W, H);
  px = new Uint32Array(img.data.buffer);
  seed();
}

function setMode(i) {
  mode = MODES[i];
  if (mode.type === 'gen') {
    bornT.fill(0); surviveT.fill(0);
    for (const n of mode.born) bornT[n] = 1;
    for (const n of mode.survive) surviveT[n] = 1;
  }
  buildLut();
  seed();
  [...panel.querySelectorAll('[data-mode]')].forEach((b, j) => b.classList.toggle('on', i === j));
}

function step() {
  const cyc = mode.type === 'cyclic', n = mode.n, c = mode.c;
  for (let y = 0; y < H; y++) {
    const r = y * W, ru = (y ? y - 1 : H - 1) * W, rd = (y + 1 === H ? 0 : y + 1) * W;
    for (let x = 0; x < W; x++) {
      const xl = x ? x - 1 : W - 1, xr = x + 1 === W ? 0 : x + 1;
      const s = cur[r + x];
      if (cyc) {
        // клетку «съедает» сосед со следующим по кругу состоянием
        const t = s + 1 === n ? 0 : s + 1;
        next[r + x] = (cur[ru + x] === t || cur[rd + x] === t || cur[r + xl] === t || cur[r + xr] === t) ? t : s;
      } else {
        const k = (cur[ru + xl] === 1) + (cur[ru + x] === 1) + (cur[ru + xr] === 1)
                + (cur[r + xl] === 1) + (cur[r + xr] === 1)
                + (cur[rd + xl] === 1) + (cur[rd + x] === 1) + (cur[rd + xr] === 1);
        let v;
        if (s === 0) v = bornT[k];
        else if (s === 1) v = surviveT[k] ? 1 : (c > 2 ? 2 : 0);
        else v = s + 1 === c ? 0 : s + 1;
        next[r + x] = v;
      }
    }
  }
  [cur, next] = [next, cur];
}

function draw() {
  if (mode.type === 'cyclic') {
    buildLut(); // палитра медленно вращается
    for (let i = 0; i < px.length; i++) px[i] = lut[cur[i]];
  } else {
    for (let i = 0; i < px.length; i++) {
      const h = cur[i] === 1 ? 255 : Math.min(heat[i] * .93 | 0, 200);
      heat[i] = h;
      px[i] = lut[h];
    }
  }
  ctx.putImageData(img, 0, 0);
}

// «взрыв» случайных клеток в круге радиуса rad
function burst(cx, cy, rad) {
  const cyc = mode.type === 'cyclic';
  for (let dy = -rad; dy <= rad; dy++) {
    for (let dx = -rad; dx <= rad; dx++) {
      if (dx * dx + dy * dy > rad * rad) continue;
      const i = ((cy + dy + H) % H) * W + (cx + dx + W) % W;
      cur[i] = cyc ? Math.random() * mode.n : Math.random() < .5;
    }
  }
}

let down = false, lastX = 0, lastY = 0;
const cellAt = e => [Math.floor(e.clientX / CELL), Math.floor(e.clientY / CELL)];

canvas.addEventListener('pointerdown', e => {
  down = true;
  canvas.setPointerCapture(e.pointerId);
  [lastX, lastY] = cellAt(e);
  burst(lastX, lastY, 14);
  hint.style.opacity = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!down) return;
  const [x, y] = cellAt(e);
  // интерполируем, чтобы при быстром движении не было разрывов
  const steps = Math.max(Math.abs(x - lastX), Math.abs(y - lastY), 1);
  for (let i = 1; i <= steps; i += 2) {
    burst(Math.round(lastX + (x - lastX) * i / steps), Math.round(lastY + (y - lastY) * i / steps), 4);
  }
  lastX = x; lastY = y;
});
addEventListener('pointerup', () => down = false);
addEventListener('pointercancel', () => down = false);

function addButton(label, onClick, modeIndex) {
  const b = document.createElement('button');
  b.textContent = label;
  if (modeIndex !== undefined) b.dataset.mode = modeIndex;
  b.addEventListener('click', () => onClick(b));
  panel.appendChild(b);
  return b;
}

MODES.forEach((m, i) => addButton(m.name, () => setMode(i), i));
const pauseBtn = addButton('Пауза', togglePause);
addButton('Заново', seed);
addButton('Очистить', clearField);

function togglePause() {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Пуск' : 'Пауза';
  pauseBtn.classList.toggle('on', paused);
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key >= '1' && e.key <= String(MODES.length)) setMode(+e.key - 1);
  else if (e.code === 'KeyR') seed();
  else if (e.code === 'KeyC') clearField();
});

addEventListener('resize', resize);

function loop() {
  frame++;
  // «Спирали» идут каждый кадр, остальные — через кадр, иначе слишком быстро
  if (!paused && (mode.type === 'cyclic' || frame % 2 === 0)) step();
  draw();
  requestAnimationFrame(loop);
}

resize();
setMode(0);
loop();
</script>
</body>
</html>
