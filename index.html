<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клеточный автомат</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; cursor: crosshair; touch-action: none;
  }
  #panel {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    box-sizing: border-box; width: min(780px, calc(100vw - 24px)); padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
    background: rgba(10, 12, 20, .7); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .12); border-radius: 14px;
    color: #dfe3f0; font: 13px/1.3 system-ui, -apple-system, sans-serif;
  }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #panel.min #presets, #panel.min #help { display: none; }
  button, select, #rule {
    padding: 7px 11px; color: inherit; background: rgba(255, 255, 255, .06);
    border: 1px solid transparent; border-radius: 9px; font: inherit; cursor: pointer;
  }
  button:hover, select:hover { background: rgba(255, 255, 255, .14); }
  button.on { border-color: rgba(255, 255, 255, .5); background: rgba(255, 255, 255, .18); }
  select option { color: #000; }
  #rule {
    flex: 1; min-width: 150px; cursor: text; outline: none;
    font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em;
    border-color: rgba(255, 255, 255, .2);
  }
  #rule:focus { border-color: rgba(255, 255, 255, .6); }
  #rule.err { border-color: #ff5d6c; }
  #presets button { padding: 5px 9px; font-size: 12px; }
  #help { font-size: 12px; color: rgba(223, 227, 240, .6); }
  #help.err { color: #ff8a95; }
  #help code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #dfe3f0; }
  #hint {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(255, 255, 255, .75); font: 13px system-ui, -apple-system, sans-serif;
    text-shadow: 0 1px 4px #000; pointer-events: none; transition: opacity 1s;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Кликай и води мышкой по полю · пробел — пауза</div>
<div id="panel">
  <div class="row">
    <input id="rule" spellcheck="false" autocomplete="off" aria-label="Правило">
    <button id="pause">Пауза</button>
    <button id="reseed">Заново</button>
    <button id="clear">Очистить</button>
    <select id="cell" title="Размер клетки"></select>
    <button id="min" title="Свернуть панель">▾</button>
  </div>
  <div class="row" id="presets"></div>
  <div id="help"></div>
</div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
out vec2 vUv;
void main() {
  // один треугольник на весь экран, без буферов
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2. - 1., 0, 1);
}
</script>

<script id="simFs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
// R — состояние клетки, G — «тепло» для светящегося следа
uniform sampler2D uTex;
uniform ivec2 uSize;
uniform int uOp; // 0 шаг, 1 кисть, 2 случайное поле, 3 очистка
uniform int uCyclic, uBorn, uSurvive, uC, uR, uT, uMoore;
uniform float uSeed, uDensity, uRad;
uniform vec2 uA, uB;
out vec4 o;

float rnd(vec2 p) {
  vec3 q = fract(vec3(p.xyx + uSeed * 1000.) * .1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

vec4 randomCell() {
  float r = rnd(gl_FragCoord.xy);
  int v = uCyclic == 1 ? int(r * float(uC)) : int(r < uDensity);
  return vec4(float(v) / 255., 0, 0, 1);
}

int state(ivec2 d) {
  return int(texelFetch(uTex, (ivec2(gl_FragCoord.xy) + d + uSize) % uSize, 0).r * 255. + .5);
}

void main() {
  vec4 me = texelFetch(uTex, ivec2(gl_FragCoord.xy), 0);
  if (uOp == 3) { o = vec4(0, 0, 0, 1); return; }
  if (uOp == 2) { o = randomCell(); return; }
  if (uOp == 1) {
    // расстояние до отрезка uA–uB: мазок кисти
    vec2 pa = gl_FragCoord.xy - uA, ba = uB - uA;
    float d = length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-4), 0., 1.));
    o = d <= uRad ? randomCell() : me;
    return;
  }

  int s = int(me.r * 255. + .5);
  // циклический: считаем соседей со следующим по кругу состоянием; иначе — живых
  int want = uCyclic == 1 ? (s + 1) % uC : 1;
  int k = 0;
  for (int dy = -uR; dy <= uR; dy++) {
    for (int dx = -uR; dx <= uR; dx++) {
      if (dx == 0 && dy == 0) continue;
      if (uMoore == 0 && abs(dx) + abs(dy) > uR) continue;
      if (state(ivec2(dx, dy)) == want) k++;
    }
  }

  int v;
  if (uCyclic == 1) v = k >= uT ? want : s;
  else if (s == 0) v = (uBorn >> k) & 1;
  else if (s == 1) v = ((uSurvive >> k) & 1) == 1 ? 1 : (uC > 2 ? 2 : 0);
  else v = s + 1 >= uC ? 0 : s + 1;

  // вычитаем константу, иначе из-за округления до 8 бит след никогда не погаснет
  float heat = v == 1 ? 1. : max(min(me.g * .93, .78) - .003, 0.);
  o = vec4(float(v) / 255., heat, 0, 1);
}
</script>

<script id="drawFs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform int uCyclic, uC;
uniform float uHue, uTime;
in vec2 vUv;
out vec4 o;

vec3 hsl(float h, float s, float l) {
  vec3 k = mod(vec3(0, 8, 4) + h * 12., 12.);
  return l - s * min(l, 1. - l) * clamp(min(k - 3., 9. - k), -1., 1.);
}

void main() {
  vec4 t = texture(uTex, vUv);
  vec3 col;
  if (uCyclic == 1) {
    // палитра медленно вращается
    col = hsl(fract(t.r * 255. / float(uC) + uTime), .85, .5);
  } else {
    float h = t.g;
    col = h > .99 ? hsl(fract(uHue + .19), 1., .88)
                  : hsl(fract(uHue + .19 * h), .9, .03 + .55 * h * h);
  }
  o = vec4(col, 1);
}
</script>

<script>
const PRESETS = [
  ['Спирали', 'R1/T1/C14/NN'],
  ['Жизнь', 'B3/S23'],
  ['Мозг Брайана', 'B2/S/C3'],
  ['Звёздные войны', 'B2/S345/C4'],
  ['HighLife', 'B36/S23'],
  ['День и ночь', 'B3678/S34678'],
  ['Лабиринт', 'B3/S12345'],
  ['Кораллы', 'B3/S45678'],
  ['Отжиг', 'B4678/S35678'],
  ['Лягушки', 'B34/S12/C3'],
  ['Идеальные спирали', 'R1/T3/C4/NM'],
  ['Турбулентность', 'R2/T5/C8/NM'],
  ['Кубизм', 'R2/T5/C3/NN'],
  ['Лава-лампа', 'R2/T10/C3/NM'],
];
const HELP = '<code>B3/S23/C2</code> — при скольких живых соседях клетка рождается (B) и выживает (S), '
  + 'C — число состояний. Циклический: <code>R1/T1/C14/NN</code> — радиус, порог, число цветов, '
  + 'окрестность (NM — 8 соседей, NN — ромб).';
const DENSITY = .2;
const MAX_RANGE = 5;

const $ = id => document.getElementById(id);
const canvas = $('c'), panel = $('panel'), ruleInput = $('rule'), help = $('help'), hint = $('hint');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });

let W, H, cell = 3, rule, paused = false;
let tex = [], fbo = [], cur = 0;
let strokes = []; // мазки кисти, накопленные с прошлого кадра

function parseRule(str) {
  const r = {};
  for (const tok of str.toUpperCase().replace(/\s/g, '').split('/')) {
    if (!tok) continue;
    const k = tok[0] === 'G' ? 'C' : tok[0], v = tok.slice(1);
    if (k === 'B' || k === 'S') {
      if (!/^[0-8]*$/.test(v)) throw `После ${k} — только цифры от 0 до 8`;
      r[k] = [...v].reduce((m, d) => m | 1 << d, 0);
    } else if (k === 'C' || k === 'R' || k === 'T') {
      if (!/^\d+$/.test(v)) throw `После ${k} нужно число`;
      r[k] = +v;
    } else if (k === 'N') {
      if (v !== 'M' && v !== 'N') throw 'Окрестность — NM или NN';
      r.N = v;
    } else throw `Не понимаю «${tok}»`;
  }
  const cyclic = 'R' in r || 'T' in r || 'N' in r;
  const c = r.C ?? (cyclic ? 14 : 2);
  if (c < 2 || c > 255) throw 'C — от 2 до 255';
  if (cyclic) {
    if ('B' in r || 'S' in r) throw 'B/S и R/T/N нельзя смешивать';
    const range = r.R ?? 1;
    if (range < 1 || range > MAX_RANGE) throw `R — от 1 до ${MAX_RANGE}`;
    if (r.T === 0) throw 'T — от 1';
    return { cyclic, c, range, threshold: r.T ?? 1, moore: r.N !== 'N' };
  }
  if (!('B' in r) && !('S' in r)) throw 'Нужно хотя бы B или S';
  if (r.B & 1) throw 'B0 заставляет мигать всё поле — не поддерживается';
  return { cyclic, c, born: r.B ?? 0, survive: r.S ?? 0 };
}

const normalize = s => s.toUpperCase().replace(/\s/g, '');

function hueOf(str) {
  let h = 0;
  for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h % 360 / 360;
}

function compile(type, id) {
  const s = gl.createShader(type);
  gl.shaderSource(s, $(id).textContent);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function program(fsId) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, 'vs'));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsId));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    loc[name] = gl.getUniformLocation(p, name);
  }
  return { p, loc };
}

let sim, view;

function resize() {
  W = Math.ceil(innerWidth / cell);
  H = Math.ceil(innerHeight / cell);
  canvas.width = W;
  canvas.height = H;
  for (let i = 0; i < 2; i++) {
    gl.deleteTexture(tex[i]);
    gl.deleteFramebuffer(fbo[i]);
    tex[i] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    fbo[i] = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[i]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex[i], 0);
  }
  gl.viewport(0, 0, W, H);
  strokes = [];
  seed();
}

// один проход шейдера симуляции: читаем из tex[cur], пишем во второй буфер, меняем местами
function pass(op, stroke) {
  const u = sim.loc;
  gl.useProgram(sim.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[1 - cur]);
  gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
  gl.uniform2i(u.uSize, W, H);
  gl.uniform1i(u.uOp, op);
  gl.uniform1i(u.uCyclic, +rule.cyclic);
  gl.uniform1i(u.uC, rule.c);
  gl.uniform1i(u.uBorn, rule.born ?? 0);
  gl.uniform1i(u.uSurvive, rule.survive ?? 0);
  gl.uniform1i(u.uR, rule.range ?? 1);
  gl.uniform1i(u.uT, rule.threshold ?? 1);
  gl.uniform1i(u.uMoore, +(rule.moore ?? true));
  gl.uniform1f(u.uSeed, Math.random());
  // кисть сеет гуще, чем начальное заполнение
  gl.uniform1f(u.uDensity, op === 1 ? .5 : DENSITY);
  if (stroke) {
    gl.uniform2f(u.uA, stroke.ax, stroke.ay);
    gl.uniform2f(u.uB, stroke.bx, stroke.by);
    gl.uniform1f(u.uRad, stroke.rad);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  cur = 1 - cur;
}

const seed = () => pass(2);
const clearField = () => pass(3);

function draw(time) {
  const u = view.loc;
  gl.useProgram(view.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
  gl.uniform1i(u.uCyclic, +rule.cyclic);
  gl.uniform1i(u.uC, rule.c);
  gl.uniform1f(u.uHue, rule.hue);
  gl.uniform1f(u.uTime, time / 15000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function setRule(str, reseed) {
  let parsed;
  try {
    parsed = parseRule(str);
  } catch (e) {
    ruleInput.classList.add('err');
    help.classList.add('err');
    help.textContent = e;
    return;
  }
  ruleInput.classList.remove('err');
  help.classList.remove('err');
  help.innerHTML = HELP;
  parsed.hue = hueOf(normalize(str));
  // при смене типа автомата старое поле бессмысленно, а в пределах типа — интересно понаблюдать
  const typeChanged = !rule || rule.cyclic !== parsed.cyclic;
  rule = parsed;
  if (tex.length && (reseed || typeChanged)) seed();
  for (const b of $('presets').children) b.classList.toggle('on', b.dataset.rule === normalize(str));
}

function togglePause() {
  paused = !paused;
  $('pause').textContent = paused ? 'Пуск' : 'Пауза';
  $('pause').classList.toggle('on', paused);
}

function init() {
  if (!gl) {
    help.textContent = 'Этот браузер не поддерживает WebGL 2.';
    help.classList.add('err');
    return;
  }
  sim = program('simFs');
  view = program('drawFs');

  for (const [name, r] of PRESETS) {
    const b = document.createElement('button');
    b.textContent = name;
    b.title = r;
    b.dataset.rule = r;
    b.addEventListener('click', () => { ruleInput.value = r; setRule(r, true); });
    $('presets').appendChild(b);
  }
  for (const n of [1, 2, 3, 4, 6, 8]) $('cell').add(new Option(`${n} px`, n, false, n === cell));

  ruleInput.value = PRESETS[0][1];
  setRule(ruleInput.value);
  resize();

  ruleInput.addEventListener('input', () => setRule(ruleInput.value));
  $('pause').addEventListener('click', togglePause);
  $('reseed').addEventListener('click', seed);
  $('clear').addEventListener('click', clearField);
  $('cell').addEventListener('change', e => { cell = +e.target.value; resize(); });
  $('min').addEventListener('click', () => {
    $('min').textContent = panel.classList.toggle('min') ? '▴' : '▾';
  });
  addEventListener('resize', resize);

  addEventListener('keydown', e => {
    if (e.target === ruleInput) return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.code === 'KeyR') seed();
    else if (e.code === 'KeyC') clearField();
  });

  let down = false, lastX = 0, lastY = 0;
  // текстура перевёрнута по вертикали относительно экрана
  const cellAt = e => [e.clientX / innerWidth * W, (1 - e.clientY / innerHeight) * H];
  canvas.addEventListener('pointerdown', e => {
    down = true;
    canvas.setPointerCapture(e.pointerId);
    ruleInput.blur();
    [lastX, lastY] = cellAt(e);
    strokes.push({ ax: lastX, ay: lastY, bx: lastX, by: lastY, rad: Math.max(56 / cell, 2) });
    hint.style.opacity = 0;
  });
  canvas.addEventListener('pointermove', e => {
    if (!down) return;
    const [x, y] = cellAt(e);
    strokes.push({ ax: lastX, ay: lastY, bx: x, by: y, rad: Math.max(16 / cell, 1.5) });
    lastX = x; lastY = y;
  });
  addEventListener('pointerup', () => down = false);
  addEventListener('pointercancel', () => down = false);

  let prev = 0, acc = 0;
  function loop(time) {
    for (const s of strokes) pass(1, s);
    strokes = [];
    // шаги привязаны ко времени, а не к частоте обновления экрана
    const interval = rule.cyclic ? 1000 / 60 : 1000 / 30;
    acc = Math.min(acc + time - prev, interval * 2);
    prev = time;
    if (acc >= interval) {
      acc -= interval;
      if (!paused) pass(0);
    }
    draw(time);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
